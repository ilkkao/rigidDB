name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  id-token: write # Codecov upload with OIDC instead of a token

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run coverage

      - name: Upload coverage to Codecov
        if: matrix.node == 26
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
